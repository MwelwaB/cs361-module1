<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Student Registration Form</h1>
</header>

<main>
<form action="#" method="POST">

    <!-- Personal Details -->
    <fieldset>
        <legend>Personal Details</legend>

        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" required>

        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <br><br>

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone">

        <br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob">

        <br><br>

        <p>Gender:</p>
        <label><input type="radio" name="gender" value="male"> Male</label>
        <label><input type="radio" name="gender" value="female"> Female</label>
        <label><input type="radio" name="gender" value="other"> Other</label>

        <br><br>

        <label for="photo">Profile Photo:</label>
        <input type="file" id="photo" name="photo" accept="image/*">

    </fieldset>

    <br>

    <!-- Academic Details -->
    <fieldset>
        <legend>Academic Details</legend>

        <label for="studentid">Student ID:</label>
        <input type="text" id="studentid" name="studentid"
               pattern="[0-9]{8}" required>

        <br><br>

        <label for="programme">Programme:</label>
        <select id="programme" name="programme">
            <option value="CS">Computer Science</option>
            <option value="IT">Information Technology</option>
            <option value="IS">Information Systems</option>
        </select>

        <br><br>

        <label for="year">Year of Study:</label>
        <input type="number" id="year" name="year" min="1" max="5">

        <br><br>

        <p>Specialisation:</p>
        <label><input type="checkbox" name="spec" value="web"> Web</label>
        <label><input type="checkbox" name="spec" value="security"> Security</label>
        <label><input type="checkbox" name="spec" value="ai"> AI</label>
        <label><input type="checkbox" name="spec" value="networks"> Networks</label>

    </fieldset>

    <br>

    <!-- About + Buttons -->
    <fieldset>
        <legend>Additional Information</legend>

        <label for="about">Tell us about yourself:</label><br>
        <textarea id="about" name="about" rows="4" required></textarea>

        <br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>

    </fieldset>

</form>
</main>

<footer>
    <p>&copy; 2026 Student Portal</p>
</footer>

</body>
</html>
